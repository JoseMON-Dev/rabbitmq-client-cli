name: Compile Rabbit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Compile for Linux
        run: deno compile --no-check --target x86_64-unknown-linux-gnu --output rabbit-linux rabbit.ts

      - name: Compile for Windows
        run: deno compile --no-check --target x86_64-pc-windows-msvc --output rabbit-windows.exe rabbit.ts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries
          path: |
            rabbit-linux
            rabbit-windows.exe
