name: Compile and Release Rabbit

on:
  push:
    tags:
      - 'v*' # Se activa cuando creas un tag como v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Compile for Linux
        run: deno compile --no-check --target x86_64-unknown-linux-gnu --output rabbit-linux rabbit.ts

      - name: Compile for Windows
        run: deno compile --no-check --target x86_64-pc-windows-msvc --output rabbit-windows.exe rabbit.ts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rabbit-linux
            rabbit-windows.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
